# What WoW Forever addons are not allowed to do.
#
# This file is the single hand-maintained source for the restriction data. The
# generator reads it and emits three things, so they cannot drift apart:
#
#   1. a banner at the TOP of every affected page in reference/api/
#   2. data/restrictions.json, which the linter checks source against
#   3. cross-link validation - every symbol named here must resolve to a
#      generated page, or be marked no_api_page, so a restriction can never
#      quietly point at a function that no longer exists
#
# Everything here was measured on a live client, not read in a patch note. The
# `evidence` field names the section of research/findings.md that records the
# measurement, and those anchors are validated too.
#
# Most of these are NOT attached to a single function. Refusing a combat-log
# subscription is an event-level rule; aura secrecy is a category gate that
# governs a whole namespace; the auction throttle is a behaviour of a call that
# succeeds. A schema that only annotated functions would drop most of the
# contribution, so `kind` is first-class and `symbols` is optional.

meta:
  measured_on: 2026-09-18
  client: "1.60.1"
  build: "69913"
  interface: 16001
  measured_by: ForeverProbe
  evidence_doc: research/findings.md
  # Scope vocabulary:
  #   always    - applies at all times, combat or not
  #   in-combat - the gate is open out of combat and closes on entering it
  # Verdict vocabulary:
  #   forbidden - the call or subscription is refused outright
  #   blocked   - refused only under some condition, usually combat
  #   secret    - the call succeeds and returns a value addon code may not read
  #   silent    - the call succeeds and returns nothing, with no error
  #   broken    - a client bug rather than a policy decision
  #   caution   - measured, but the measurement is weak; re-test before relying

entries:
  # -- Event subscription ---------------------------------------------------
  - id: combat-log-subscription
    kind: event
    events: [COMBAT_LOG_EVENT, COMBAT_LOG_EVENT_UNFILTERED]
    verdict: forbidden
    scope: always
    summary: >
      Addons may not register for the combat log, in either form.
    detail: >
      RegisterEvent fires ADDON_ACTION_FORBIDDEN and the frame never receives the
      event. Nothing is raised, so a pcall around the registration reports
      success. Measured at load, out of combat, standing in a field - this is not
      a combat-scoped rule. CombatLogGetCurrentEventInfo is absent from the
      client as well, so the restriction holds at two independent levels.
    workaround: >
      None for parsing. Blizzard ships C_DamageMeter for damage numbers. Every
      other event tried is permitted, including UNIT_AURA, UNIT_COMBAT and both
      PLAYER_REGEN events - the rule is "no combat log", not "no combat
      information".
    evidence: [P.1, P.12]

  # -- Value secrecy --------------------------------------------------------
  - id: aura-secrecy
    label: "C_UnitAuras (all reads)"
    kind: category
    gate: C_Secrets.ShouldAurasBeSecret
    namespaces: [C_UnitAuras]
    verdict: secret
    scope: in-combat
    summary: >
      Aura reads RAISE in combat. They do not return nil.
    detail: >
      While ShouldAurasBeSecret() is true, C_UnitAuras reads throw with
      "Auras cannot be accessed when secret while tainted by '<addon>'". Note
      "while tainted by": the restriction is scoped to the call stack, not the
      data - Blizzard's own UI reads the same auras in the same combat. Out of
      combat the gate is false and auras read normally, by name.
    workaround: >
      Read before the pull and hold the value, or hand a duration object to a
      Cooldown widget before combat starts and let it keep ticking.
    evidence: [P.18, P.19]

  - id: unit-power-secrecy
    kind: category
    gate: C_Secrets.ShouldUnitPowerBeSecret
    symbols: [UnitPower, UnitPowerMax]
    verdict: secret
    scope: always
    summary: >
      Unit power is secret at ALL times, including out of combat.
    detail: >
      ShouldUnitPowerBeSecret("player") is true standing still with no target,
      and UnitPower("player") returns a secret value in both combat states. This
      directly contradicts Blizzard's published doctrine, which promises that
      "all class secondary resources remain fully non-secret". Measured twice, in
      both states, by gate and by value. Either the doctrine does not describe
      this client or this is a beta bug.
    evidence: [P.3, P.10, P.18]

  - id: cooldown-secrecy
    kind: category
    gate: C_Secrets.ShouldCooldownsBeSecret
    symbols: [C_Spell.GetSpellCooldown, C_Spell.GetSpellCharges, GetActionCooldown]
    verdict: secret
    scope: in-combat
    summary: >
      Spell and action cooldowns become secret in combat.
    detail: >
      ShouldCooldownsBeSecret() and ShouldActionCooldownBeSecret() are both false
      out of combat and true in it. Blizzard ships its own cooldown manager.
    workaround: >
      The sanctioned path is C_Spell.GetSpellCooldownDuration ->
      LuaDurationObject -> Cooldown:SetCooldownFromDurationObject, which does not
      require addon code to read the number.
    evidence: [P.18]

  - id: unit-stats-secrecy
    label: "Unit stats"
    kind: category
    gate: C_Secrets.ShouldUnitStatsBeSecret
    verdict: secret
    scope: in-combat
    summary: Unit stats become secret in combat.
    evidence: [P.18]

  - id: threat-values-secrecy
    label: "Threat values"
    kind: category
    gate: C_Secrets.ShouldUnitThreatValuesBeSecret
    verdict: secret
    scope: in-combat
    summary: >
      Threat VALUES are secret in combat, but threat STATE is not.
    detail: >
      ShouldUnitThreatValuesBeSecret() is true in combat while
      ShouldUnitThreatStateBeSecret() is false. An addon may know whether it has
      aggro and not by how much. That kills the numeric threat meter and leaves
      the "you are about to pull" warning working, which does not look accidental.
    evidence: [P.18]

  - id: readable-in-combat
    label: "Identity, max health, casts, threat state"
    kind: note
    verdict: permitted
    scope: in-combat
    summary: >
      Unit identity, max health, spell casts and threat state stay readable in
      combat.
    detail: >
      Measured false on their gates while in combat:
      ShouldUnitIdentityBeSecret, ShouldUnitHealthMaxBeSecret,
      ShouldUnitSpellCastBeSecret, ShouldUnitThreatStateBeSecret. Cast bars work.
      Recorded because "addons cannot see combat" is the common summary and it is
      wrong.
    evidence: [P.18]

  # -- Protected actions ----------------------------------------------------
  - id: useaction-forbidden
    kind: symbol
    symbols: [UseAction]
    verdict: forbidden
    scope: always
    summary: UseAction fires ADDON_ACTION_FORBIDDEN in and out of combat.
    evidence: [P.4, P.20]

  - id: combat-blocked-actions
    kind: symbol
    symbols: [EditMacro, SetOverrideBindingClick, SetOverrideBinding, SetBinding]
    verdict: blocked
    scope: in-combat
    summary: >
      Macro editing and binding overrides are permitted out of combat and blocked
      in it.
    detail: >
      ADDON_ACTION_BLOCKED, which is retail's long-standing behaviour and is
      unremarkable. Measured for EditMacro and SetOverrideBindingClick; the other
      binding setters are listed by association and have not been measured
      individually.
    evidence: [P.20]

  - id: reloadui-protected
    kind: symbol
    symbols: [ReloadUI]
    verdict: forbidden
    scope: always
    summary: >
      An addon cannot reload the UI. A human must type /reload.
    detail: >
      This is the binding constraint on any out-of-game bridge: the inbound
      channel works, but refreshing it costs a manual /reload.
    evidence: ["0.2", P.9]

  - id: secure-setattribute-in-combat
    kind: symbol
    symbols: ["SecureActionButtonTemplate:SetAttribute"]
    no_api_page: true
    verdict: caution
    scope: in-combat
    summary: >
      SetAttribute on a secure action button SUCCEEDED in combat. Re-test before
      relying on it.
    detail: >
      Retail protects exactly this, and it is the mechanism every action-bar addon
      depends on. Our measurement is that the call raised no error and fired no
      block event - which is weaker evidence than the attribute actually taking
      effect, and this client has already shown that a refusal can be silent.
    evidence: [P.20]

  # -- Behaviours: the call succeeds and lies ------------------------------
  - id: replicate-throttle
    kind: behaviour
    symbols: [C_AuctionHouse.ReplicateItems]
    verdict: silent
    scope: always
    summary: >
      A throttled full scan returns an EMPTY MARKET, not an error.
    detail: >
      The throttle is real, measured at more than 162 seconds and at most 1047.
      When it bites, the call returns true, no REPLICATE_ITEM_LIST_UPDATE fires,
      and GetNumReplicateItems stays at 0 - indistinguishable from an auction
      house with nothing on it. IsThrottledMessageSystemReady describes the
      message system, not this throttle, and read true throughout.
    workaround: >
      Track your own last-scan time and refuse to call inside your own window.
      The client will not tell you. A naive addon writes "the market is empty"
      over its price history. Browse is unthrottled and returns the complete
      item-key market in about three seconds, so prefer it as the data source.
    evidence: [P.15, P.17]

  - id: savedvariables-not-read-back
    label: "SavedVariables"
    kind: behaviour
    verdict: broken
    scope: always
    summary: >
      The client writes SavedVariables and never reads them back.
    detail: >
      Every addon starts from defaults on every launch. Measured: the load
      counter stays at 1 across sessions and no token survives a /reload, while
      the file itself lands on disk correctly. Outbound works; the in-client round
      trip does not. Reported as a beta bug rather than a policy decision.
    workaround: >
      An external process writes Lua into the AddOns folder and the client
      executes it as addon code at load. That is the inbound bridge, and it works.
    evidence: [P.9, "0.2"]

  - id: addon-messages-restricted
    kind: behaviour
    symbols: [C_ChatInfo.SendAddonMessage, C_ChatInfo.SendAddonMessageLogged]
    verdict: caution
    scope: always
    summary: >
      AreOutgoingAddonChatMessagesRestricted() returns true, in and out of combat.
    detail: >
      The restriction probe reports outgoing addon messages as restricted in both
      states. What that restricts in practice was not measured - no message was
      sent - so this is a flag to check before designing a sideband on it, not a
      confirmed refusal.
    evidence: [P.10, P.18]

  - id: secret-value-contagion
    label: "Any secret value"
    kind: behaviour
    verdict: caution
    scope: always
    summary: >
      tostring() on a secret value returns a SECRET STRING. The taint survives
      conversion.
    detail: >
      A pcall around the read reports success and hands back a value that throws
      later, wherever it is next indexed - usually a print or a format, far from
      the read. This took the probe down mid-run. Worse, a secret string stored in
      SavedVariables would take the whole flush with it.
    workaround: >
      Use issecretvalue before AND after conversion. The client also provides
      issecrettable, hasanysecretvalues, scrub, scrubsecretvalues,
      canaccesssecrets, secretwrap and dropsecretaccess.
    evidence: [P.2]

  - id: unknown-event-registration-throws
    label: "RegisterEvent"
    kind: behaviour
    verdict: caution
    scope: always
    summary: >
      RegisterEvent on an event this client does not have RAISES, aborting the
      rest of the file.
    detail: >
      An error in an addon's main chunk stops the remainder of that file loading,
      so a single stale event name can silently remove every command the addon
      defines. Distinct from a forbidden registration, which does not raise at all.
    workaround: Wrap every RegisterEvent in pcall.
    evidence: [P.1, "0.5"]

  - id: assisted-combat-inert
    kind: note
    symbols: [C_AssistedCombat.IsAvailable, C_AssistedCombat.GetRotationSpells]
    verdict: permitted
    scope: always
    summary: >
      C_AssistedCombat exists but reports itself unavailable.
    detail: >
      IsAvailable() returns false and GetRotationSpells() returns zero entries on
      this build. Recorded for accuracy; nothing in this project builds on it.
    evidence: ["0.4", P.6]
