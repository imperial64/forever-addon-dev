# What WoW Forever addons are not allowed to do.
#
# This file is the single hand-maintained source for the restriction data. The
# generator reads it and emits three things, so they cannot drift apart:
#
#   1. a banner at the TOP of every affected page in reference/api/
#   2. data/restrictions.json, which the linter checks source against
#   3. cross-link validation - every symbol named here must resolve to a
#      generated page, or be marked no_api_page, so a restriction can never
#      quietly point at a function that no longer exists
#
# Everything here was measured on a live client, not read in a patch note. The
# `evidence` field names the section of research/findings.md that records the
# measurement, and those anchors are validated too.
#
# Most of these are NOT attached to a single function. Refusing a combat-log
# subscription is an event-level rule; aura secrecy is a category gate that
# governs a whole namespace; the auction throttle is a behaviour of a call that
# succeeds. A schema that only annotated functions would drop most of the
# contribution, so `kind` is first-class and `symbols` is optional.
#
# What does NOT belong here: what a permitted call COSTS. That lives in
# research/costs.yaml, which has the same shape and its own generated views.
# The line is whether anything refuses. A restriction is policy - identical on
# every machine, true until Blizzard changes it. A cost is a measurement on one
# machine on one build, and nothing in this repo re-measures it. A behaviour
# that silently misleads is a restriction even when no call is refused, which
# is why onupdate-elapsed-quantised is below and the microbenchmark figures
# beside it are not.

meta:
  measured_on: 2026-09-20
  client: "1.60.1"
  build: "69913"
  interface: 16001
  measured_by: "ForeverProbe (P); AmbianceCost and DynamicAmbiance (Q, and P.29)"
  evidence_doc: research/findings.md
  # `build` and `measured_on` above are the defaults. An entry re-measured on a
  # later client carries its own `build` and `measured_on`, and every generated
  # view states that entry's own build instead. Set them only when the entry's
  # evidence is a measurement on that build; never bump one without a probe run.
  # Scope vocabulary:
  #   always    - applies at all times, combat or not
  #   in-combat - the gate is open out of combat and closes on entering it
  # Verdict vocabulary:
  #   forbidden - the call or subscription is refused outright
  #   blocked   - refused only under some condition, usually combat
  #   secret    - the call succeeds and returns a value addon code may not read
  #   silent    - the call succeeds and returns nothing, with no error
  #   broken    - a client bug rather than a policy decision
  #   caution   - measured, but the measurement is weak; re-test before relying

entries:
  # -- Event subscription ---------------------------------------------------
  - id: combat-log-subscription
    kind: event
    events: [COMBAT_LOG_EVENT, COMBAT_LOG_EVENT_UNFILTERED]
    verdict: forbidden
    scope: always
    summary: >
      Addons may not register for the combat log, in either form.
    detail: >
      RegisterEvent fires ADDON_ACTION_FORBIDDEN and the frame never receives the
      event. Nothing is raised, so a pcall around the registration reports
      success. Measured at load, out of combat, standing in a field - this is not
      a combat-scoped rule. CombatLogGetCurrentEventInfo is absent from the
      client as well, so the restriction holds at two independent levels.
    workaround: >
      None for parsing. Blizzard ships C_DamageMeter for damage numbers. Every
      other event tried is permitted, including UNIT_AURA, UNIT_COMBAT and both
      PLAYER_REGEN events - the rule is "no combat log", not "no combat
      information".
    evidence: [P.1, P.12]

  # -- Value secrecy --------------------------------------------------------
  - id: aura-secrecy
    label: "C_UnitAuras (all reads)"
    kind: category
    gate: C_Secrets.ShouldAurasBeSecret
    namespaces: [C_UnitAuras]
    verdict: secret
    scope: in-combat
    summary: >
      Aura reads RAISE in combat. They do not return nil.
    detail: >
      While ShouldAurasBeSecret() is true, C_UnitAuras reads throw with
      "Auras cannot be accessed when secret while tainted by '<addon>'". Note
      "while tainted by": the restriction is scoped to the call stack, not the
      data - Blizzard's own UI reads the same auras in the same combat. Out of
      combat the gate is false and auras read normally, by name.
    workaround: >
      Read before the pull and hold the value, or hand a duration object to a
      Cooldown widget before combat starts and let it keep ticking.
    evidence: [P.18, P.19]

  - id: unit-power-secrecy
    kind: category
    gate: C_Secrets.ShouldUnitPowerBeSecret
    symbols: [UnitPower]
    verdict: secret
    scope: always
    summary: >
      Unit power is secret at ALL times, including out of combat.
    detail: >
      ShouldUnitPowerBeSecret("player") is true standing still with no target,
      and UnitPower("player") returns a secret value in both combat states. This
      directly contradicts Blizzard's published doctrine, which promises that
      "all class secondary resources remain fully non-secret". Measured twice, in
      both states, by gate and by value. Either the doctrine does not describe
      this client or this is a beta bug.

      UnitPowerMax was listed here until 2026-09-20 and has been moved out: on
      the PLAYER it is not secret in either combat state. See
      other-unit-max-values.
    evidence: [P.3, P.10, P.18, P.25]

  - id: unit-health-secrecy
    kind: category
    symbols: [UnitHealth]
    verdict: secret
    scope: always
    summary: >
      Unit health is secret at ALL times, including out of combat.
    detail: >
      Measured 2026-09-20 on the player, standing still with no target and again
      in combat: UnitHealth("player") is a secret value in both states, and so is
      a target's. It behaves exactly like UnitPower.

      This was added late. Earlier runs measured power in both states and health
      only incidentally, so the document carried an always-on gate for power and
      nothing for health. A secondary report claiming health was always secret
      turned out to be right on that point.
    workaround: >
      None for the number. The player's own UnitHealthMax is readable, so a
      denominator is available while the numerator is not; for any other unit
      neither is. Hand values to Blizzard's own widgets rather than reading them.
    evidence: [P.25, P.28]

  - id: other-unit-max-values
    label: "UnitHealthMax / UnitPowerMax on units other than the player"
    kind: category
    symbols: [UnitHealthMax, UnitPowerMax]
    verdict: secret
    scope: always
    summary: >
      Another unit's max health and max power are secret at ALL times; the
      player's own are never secret.
    detail: >
      Measured 2026-09-20. On the player, UnitHealthMax and UnitPowerMax are
      plain numbers in every state measured. On a target, both are secret in
      every state measured - including standing out of combat, on a friendly
      quest NPC and on a hostile mob alike. Hostility makes no difference.

      So the axis is the UNIT, not combat. This was first recorded as in-combat
      because the out-of-combat pass had no target selected; re-running it with
      one moved the scope to always.

      What stays readable about another unit: level, name, GUID and class.
    evidence: [P.25, P.28]

  - id: cooldown-secrecy
    kind: category
    gate: C_Secrets.ShouldCooldownsBeSecret
    symbols: [C_Spell.GetSpellCooldown, C_Spell.GetSpellCharges, GetActionCooldown]
    verdict: secret
    scope: in-combat
    summary: >
      Spell and action cooldowns become secret in combat.
    detail: >
      ShouldCooldownsBeSecret() and ShouldActionCooldownBeSecret() are both false
      out of combat and true in it. Blizzard ships its own cooldown manager.
    workaround: >
      The sanctioned path is C_Spell.GetSpellCooldownDuration ->
      LuaDurationObject -> Cooldown:SetCooldownFromDurationObject, which does not
      require addon code to read the number.
    evidence: [P.18]

  - id: unit-stats-secrecy
    label: "Unit stats"
    kind: category
    gate: C_Secrets.ShouldUnitStatsBeSecret
    verdict: secret
    scope: in-combat
    summary: Unit stats become secret in combat.
    evidence: [P.18]

  - id: threat-values-secrecy
    label: "Threat values"
    kind: category
    gate: C_Secrets.ShouldUnitThreatValuesBeSecret
    verdict: secret
    scope: in-combat
    summary: >
      Threat VALUES are secret in combat, but threat STATE is not.
    detail: >
      ShouldUnitThreatValuesBeSecret() is true in combat while
      ShouldUnitThreatStateBeSecret() is false. An addon may know whether it has
      aggro and not by how much. That kills the numeric threat meter and leaves
      the "you are about to pull" warning working, which does not look accidental.
    evidence: [P.18]

  - id: readable-in-combat
    label: "Identity, max health, casts, threat state"
    kind: note
    verdict: permitted
    scope: in-combat
    summary: >
      Unit identity, max health, spell casts and threat state stay readable in
      combat.
    detail: >
      Measured false on their gates while in combat:
      ShouldUnitIdentityBeSecret, ShouldUnitHealthMaxBeSecret,
      ShouldUnitSpellCastBeSecret, ShouldUnitThreatStateBeSecret. Cast bars work.
      Recorded because "addons cannot see combat" is the common summary and it is
      wrong.

      Max health is readable ON THE PLAYER. Measured 2026-09-20 by value, a
      TARGET's UnitHealthMax is secret in combat while the player's is not, so
      ShouldUnitHealthMaxBeSecret answers per unit and the gate above was read
      for the player. See other-unit-max-values.

      Unit identity holds up by value too: UnitName, UnitGUID, UnitClass and
      UnitLevel are all plain on both the player and the target, in and out of
      combat.
    evidence: [P.18, P.25]

  # -- Protected actions ----------------------------------------------------
  - id: useaction-forbidden
    kind: symbol
    symbols: [UseAction]
    verdict: forbidden
    scope: always
    summary: UseAction fires ADDON_ACTION_FORBIDDEN in and out of combat.
    evidence: [P.4, P.20]

  - id: combat-blocked-actions
    kind: symbol
    symbols: [EditMacro, SetOverrideBindingClick, SetOverrideBinding, SetBinding]
    verdict: blocked
    scope: in-combat
    summary: >
      Macro editing and binding overrides are permitted out of combat and blocked
      in it.
    detail: >
      ADDON_ACTION_BLOCKED, which is retail's long-standing behaviour and is
      unremarkable. Measured for EditMacro and SetOverrideBindingClick; the other
      binding setters are listed by association and have not been measured
      individually.
    evidence: [P.20]

  - id: reloadui-protected
    kind: symbol
    symbols: [ReloadUI]
    verdict: forbidden
    scope: always
    summary: >
      An addon cannot reload the UI. A human must type /reload.
    detail: >
      This is the binding constraint on any out-of-game data channel: the
      inbound channel works, but refreshing it costs a manual /reload.
    evidence: ["0.2", P.9]

  - id: secure-setattribute-in-combat
    kind: symbol
    symbols: ["SecureActionButtonTemplate:SetAttribute"]
    no_api_page: true
    verdict: caution
    scope: in-combat
    summary: >
      SetAttribute on a secure action button SUCCEEDED in combat. Re-test before
      relying on it.
    detail: >
      Retail protects exactly this, and it is the mechanism every action-bar addon
      depends on. The measurement here is that the call raised no error and fired
      no block event - which is weaker evidence than the attribute actually taking
      effect, and this client has already shown that a refusal can be silent.

      Build 70009 sharpens the doubt. In P.32, an insecure SetAttribute on a
      protected frame in combat (SecureHandlersUpdateFrame:SetAttribute()) was
      refused with ADDON_ACTION_BLOCKED and no error. This client does refuse
      that shape of call, and it does so by event only. P.20 was measured on
      69913, and nobody recorded whether that button was protected or whether its
      attribute took effect. Re-test with the block log open.
    evidence: [P.20, P.32]

  - id: secure-snippets-in-combat
    label: "Secure snippets (SecureHandler templates, frame:Execute)"
    kind: behaviour
    build: "70009"
    measured_on: 2026-09-25
    verdict: blocked
    scope: in-combat
    summary: >
      Secure snippets RUN out of combat. In combat, Execute is refused:
      silently, with ADDON_ACTION_BLOCKED and no error, on a frame made before
      combat, and with a raise on a frame made during it.
    detail: >
      Out of combat, frames from SecureHandlerBaseTemplate and
      SecureHandlerAttributeTemplate ran frame:Execute("self:SetAttribute('fbok',42)")
      and read back 42, with no block event.

      In combat, Execute on those same pre-combat frames returned normally, so
      a pcall reports success. The attribute kept its old value, and two
      ADDON_ACTION_BLOCKED events named SecureHandlersUpdateFrame:SetAttribute().
      On frames created in combat, Execute raised "SecureHandlers.lua:690: Header
      frame must be explicitly protected".

      loadstring_untainted is still absent on 70009: type() returns nil in both
      combat states, while snippets run. Its absence was reported as the cause of
      broken snippets on earlier builds (findings 0.2, 14), and that is out of
      date. The missing global is not a feature test.

      Only Execute was measured. WrapScript, SetFrameRef, state drivers,
      action-bar paging and click-casting were not run on 70009. This looks like
      retail's ordinary combat lockdown, but no retail client was measured.
    workaround: >
      Decide snippet support by running one out of combat and reading the result
      back, never by checking type(loadstring_untainted). Create and configure
      every secure header before combat. Check InCombatLockdown() before calling
      Execute, and treat a normal return in combat as a failure unless the
      attribute changed. Register ADDON_ACTION_BLOCKED to see the refusal.
    evidence: [P.32]

  # -- Behaviours: the call succeeds and lies ------------------------------
  - id: replicate-throttle
    kind: behaviour
    symbols: [C_AuctionHouse.ReplicateItems]
    verdict: silent
    scope: always
    summary: >
      A throttled full scan returns an EMPTY MARKET, not an error.
    detail: >
      The throttle is real, measured at more than 162 seconds and at most 1047.
      When it bites, the call returns true, no REPLICATE_ITEM_LIST_UPDATE fires,
      and GetNumReplicateItems stays at 0 - indistinguishable from an auction
      house with nothing on it. IsThrottledMessageSystemReady describes the
      message system, not this throttle, and read true throughout.
    workaround: >
      Track your own last-scan time and refuse to call inside your own window.
      The client will not tell you. A naive addon writes "the market is empty"
      over its price history. Browse is unthrottled and returns the complete
      item-key market in about three seconds, so prefer it as the data source.
    evidence: [P.15, P.17]

  - id: savedvariables-load-order
    label: "SavedVariables (restore timing, ## LoadSavedVariablesFirst)"
    kind: behaviour
    build: "70009"
    measured_on: 2026-09-25
    verdict: caution
    scope: always
    summary: >
      SavedVariables ARE read back, account-wide and per-character, across
      /reload and a full relaunch. The trap is timing: by default the client
      REPLACES each saved global at ADDON_LOADED, after the addon's file scope
      has run.
    detail: >
      A token seeded before a full exit and relaunch through Battle.net
      came back in every saved global of two test addons, account-wide and
      per-character alike. The same happened across /reload.

      The default order is retail's. Every saved global is nil while the addon's
      files run. At ADDON_LOADED the client swaps in the restored table, and
      whatever the file assigned is discarded. So `X = X or {}` followed by
      `local db = X` at file scope leaves db pointing at an orphan. Every write
      through it is lost, and nothing errors. On an addon's very first launch,
      with no file on disk yet, the client leaves the file-scope table alone. The
      orphan therefore only appears from the second launch on.

      `## LoadSavedVariablesFirst: 1` in the .toc moves the restore ahead of file
      scope. Then an unconditional file-scope `X = {...}` DISCARDS the restored
      data, and the fresh table is what gets written at exit. `X = X or {...}`
      keeps it. GetAddOnMetadata returns nil for the directive, so an addon
      cannot ask which order it is in.

      The two exotic WTF paths, WTF\Account\SavedVariables\ and
      WTF\SavedVariables\, are still neither read nor written on 70009 (P.33).

      History, build 69913 (P.23, P.27): account-wide was never read back.
      Per-character survived a /reload but not a restart. The flush was
      destructive, because a /reload before running anything wrote an empty
      table over the last session's data. None of that holds on 70009. Re-check
      it on every new build: the fix came unannounced and can leave the same
      way.
    workaround: >
      Bind every saved global inside ADDON_LOADED and only mutate it. Never take
      a file-scope reference to one. That is safe under either order. Declare
      ## LoadSavedVariablesFirst: 1 only if you need saved values at file scope,
      and then never assign the global unconditionally.

      Remove any workaround installed for 69913: ForeverSVFix, WTFix, svshim, a
      SavedVariablesLink-style .toc line, or a symbolic link or junction under
      WTF or AddOns. The client now restores the file itself, so a second
      mechanism injecting the same global either repeats the restore or
      overwrites it with an older copy. That is reasoning from the measured order,
      not a measurement of those tools.
    evidence: [P.30, P.31, P.33, P.23, P.27, P.21]

  - id: addon-messages-restricted
    kind: behaviour
    symbols: [C_ChatInfo.SendAddonMessage, C_ChatInfo.SendAddonMessageLogged]
    verdict: caution
    scope: always
    summary: >
      AreOutgoingAddonChatMessagesRestricted() returns true, in and out of combat.
    detail: >
      The restriction probe reports outgoing addon messages as restricted in both
      states. What that restricts in practice was not measured - no message was
      sent - so this is a flag to check before designing a sideband on it, not a
      confirmed refusal.
    evidence: [P.10, P.18]

  - id: secret-value-contagion
    label: "Any secret value"
    kind: behaviour
    verdict: caution
    scope: always
    summary: >
      tostring() on a secret value returns a SECRET STRING. The taint survives
      conversion.
    detail: >
      A pcall around the read reports success and hands back a value that throws
      later, wherever it is next indexed - usually a print or a format, far from
      the read. This took the probe down mid-run. Worse, a secret string stored in
      SavedVariables would take the whole flush with it.

      Two things measured 2026-09-20 that make this harder to spot than it looks.
      type() reports "number" on a secret number, so a type check is NOT a
      secrecy check. And EQUALITY throws: `value == value` raises, which means
      the reflexive `if value == nil then` guard is itself unsafe on a secret.
      Comparison and arithmetic throw as expected; equality throwing is the one
      that catches people, because it is the guard they wrote to be careful.
    workaround: >
      issecretvalue is the only safe test - not type(), not a comparison against
      nil. Use it before AND after conversion. The client also provides
      issecrettable, hasanysecretvalues, scrub, scrubsecretvalues,
      canaccesssecrets, secretwrap and dropsecretaccess.
    evidence: [P.2, P.25, P.28]

  - id: unknown-event-registration-throws
    label: "RegisterEvent"
    kind: behaviour
    verdict: caution
    scope: always
    summary: >
      RegisterEvent on an event this client does not have RAISES, aborting the
      rest of the file.
    detail: >
      An error in an addon's main chunk stops the remainder of that file loading,
      so a single stale event name can silently remove every command the addon
      defines. Distinct from a forbidden registration, which does not raise at all.
    workaround: Wrap every RegisterEvent in pcall.
    evidence: [P.1, "0.5"]

  - id: assisted-combat-inert
    kind: note
    symbols: [C_AssistedCombat.IsAvailable, C_AssistedCombat.GetRotationSpells]
    verdict: permitted
    scope: always
    summary: >
      C_AssistedCombat exists but reports itself unavailable.
    detail: >
      IsAvailable() returns false and GetRotationSpells() returns zero entries on
      this build. Recorded for accuracy; nothing in this project builds on it.
    evidence: ["0.4", P.6]

  # -- Graphics CVars -------------------------------------------------------
  - id: graphics-cvars-writable
    label: "Brightness, Contrast, Gamma"
    kind: note
    symbols: [C_CVar.SetCVar, SetCVar]
    verdict: permitted
    scope: always
    summary: >
      Display brightness and contrast ARE addon-writable, live, at frame rate.
    detail: >
      Brightness, Contrast and Gamma carry no lock flags - GetCVarInfo reports
      isLockedFromUser, isSecure and isReadOnly all false. Writes land through
      both C_CVar.SetCVar and the undocumented global SetCVar, identically, and
      read back exactly. A write is a cheap live post-process, not a device
      restart: a four-second sweep writing every frame from OnUpdate managed 442
      writes over 443 frames at 111 fps, worst frame gap 31 ms. That is a ceiling
      rather than a cost; the per-call figures are in research/costs.yaml under
      cvar-write, and a write is cheap in time but allocates ~822 bytes, which
      is the cost that actually constrains a per-frame design. Brightness and
      Contrast are on a 0-100 scale (default 50), Gamma centres on 1.0. Measured
      in maximized windowed mode at 1920x1080, so this is not fullscreen-only.

      MEASURED IN COMBAT on 2026-09-20 and permitted. The same instrument ran
      out of combat and mid-fight one pull apart: writes landed and read back
      identically, the lock flags stayed false, and no ADDON_ACTION_BLOCKED or
      ADDON_ACTION_FORBIDDEN was captured in either state. That refusal count is
      a captured event count rather than a pcall result, which is the
      distinction this client requires. A per-frame sweep driving BOTH Brightness
      and Contrast managed 1742 writes over 871 frames in combat at 290 fps,
      worst frame gap 9 ms - five times the write rate of the out-of-combat ramp
      above. This entry previously said combat was unmeasured and advised
      freezing on PLAYER_REGEN_DISABLED; that caveat is withdrawn.

      NOT measured: whether this extends to CVars other than Brightness and
      Contrast, or to instanced rather than open-world combat. /fprobe video in
      combat has still not been run - the combat result came from a third-party
      instrument, not from this repo's probe.
    workaround: >
      None needed for combat. If you drive one of these from OnUpdate, the cost
      to watch is allocation rather than frame time - see cvar-write in
      research/costs.yaml.
    evidence: [P.22, P.29]

  - id: retail-graphics-cvar-names-absent
    kind: behaviour
    verdict: caution
    scope: always
    summary: >
      gxBrightness, gxContrast and gxGamma do NOT exist on this client.
    detail: >
      All three retail names report present=false. The client's own names are
      Brightness, Contrast and Gamma, with HDRBrightness, HDRPeakBrightness,
      useHDRBrightness and useHDRPeakBrightness alongside them. Anything ported
      from a retail addon on the assumption that the gx-prefixed names still
      apply will not work. What a write to a name the client does not have
      actually does was NOT measured - the write tests only ran against names
      confirmed present - so do not assume it errors.
    workaround: >
      Enumerate rather than assume. ConsoleGetAllCommands() is present and
      returned 1902 commands; filtering it is how these names were found in the
      first place.
    evidence: [P.22]
  # -- Reads that are true and still mislead --------------------------------
  - id: cvar-enable-flag-pairing
    label: "Paired CVars (use<Name>)"
    kind: behaviour
    symbols: [C_CVar.GetCVar, GetCVar]
    verdict: caution
    scope: always
    summary: >
      A CVar's VALUE does not tell you whether it is in effect. The enable flag
      is a separate CVar.
    detail: >
      Measured with the client running uncapped at 273.7 fps: maxFPS read 120 and
      targetFPS read 60, while useMaxFPS and useTargetFPS both read 0. A slider
      CVar retains its last position whether or not the limit is applied, so an
      addon reading maxFPS alone concludes the client is capped at 120 when it is
      running at more than twice that - with no error, because nothing failed.
      The same shape is recorded for HDRBrightness/useHDRBrightness and
      HDRPeakBrightness/useHDRPeakBrightness in P.22. Two instances is a pattern
      to check for, NOT a proven convention: no enumeration was done to establish
      that every <Name> carries a use<Name>. Reads only - whether an addon can
      WRITE useMaxFPS was not measured.
    workaround: >
      Before trusting a CVar's value, look for a paired use<Name> and read it with
      GetCVarBool. ConsoleGetAllCommands() enumerates the real names, which is how
      the graphics CVars in P.22 were found; do not assume a flag exists because a
      neighbouring CVar has one.
    evidence: [Q.1, P.22]

  - id: onupdate-elapsed-quantised
    label: "OnUpdate elapsed"
    kind: behaviour
    verdict: caution
    scope: always
    summary: >
      The elapsed argument to an OnUpdate script is quantised to 1 ms.
    detail: >
      Across 15 phases covering 19,692 frames, every retained frame-gap statistic
      is a whole number of milliseconds and every accumulated phase duration lands
      on an exact multiple of 1 ms. Frame-rate-independent easing on elapsed is
      unaffected - the quantisation is far below the time constants involved - but
      an addon that profiles itself by accumulating elapsed produces noise for
      anything costing under about a millisecond, and the noise looks like data.
    workaround: >
      Use debugprofilestart/debugprofilestop, which are present and working on
      this client and have microsecond resolution.
    evidence: [Q.5]
